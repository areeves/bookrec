services:
  app:
    build: .
    image: bookrec-ts:dev
    environment:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
    volumes:
      - bookrec-data:/data      # SQLite cache + downloaded embedding model
      - ../input:/input:ro      # your List A / List B files
      - ./src:/app/src          # edit code without rebuilding the image

volumes:
  bookrec-data:
